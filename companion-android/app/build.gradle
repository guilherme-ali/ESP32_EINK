plugins { id 'com.android.application' }

android {
    namespace 'br.com.ideiarec.companion'
    compileSdk 36
    buildToolsVersion '35.0.0'
    ndkVersion '27.1.12297006'
    defaultConfig {
        applicationId 'br.com.ideiarec.companion'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments "-DOPUS_SOURCE_DIR=${project.findProperty('opusSourceDir') ?: ''}" }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; warningsAsErrors true }
    testOptions {
        unitTests.returnDefaultValues = false
        unitTests.all { systemProperty 'java.library.path', project.findProperty('voiceHostDir') ?: '' }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
}
