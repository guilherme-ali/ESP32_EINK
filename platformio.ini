; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; O caminho do projeto tem acento ("Aleatorios") e o ld.exe do MinGW
; corrompe esse caminho quando o link usa response file (build grande) -
; por isso o diretorio de build fica fora do projeto, num caminho ASCII.
[platformio]
build_dir = C:/pio-builds/ESP32_EINK
; So o ambiente de depuracao (com Serial/monitor) builda/grava por
; padrao. O de bateria ([env:battery], sem USB CDC) e sob demanda:
; `pio run -e battery -t upload`.
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM7
monitor_port = COM7
upload_speed = 460800

; Waveshare ESP32-S3-ePaper-1.54: flash quad (8MB) + PSRAM octal (8MB),
; integrados no chip ESP32-S3-PICO-1-N8R8 (versao V2 da placa).
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    ; Default (8KB) estoura com WiFiClientSecure + Strings grandes no
    ; caminho de transcricao (net/stt.cpp) - causava reset silencioso.
    -D ARDUINO_LOOP_STACK_SIZE=16384

; Uso no dia a dia, longe do PC: USB CDC nativo desligado. O periferico
; USB nativo do ESP32-S3 tem um bug conhecido no Arduino-ESP32 (sem
; correcao confirmada em varias versoes, ver issues #8399/#6264/#8232 no
; repo espressif/arduino-esp32) que trava o chip inteiro assim que o
; VBUS some - reproduzido nesta placa, mesmo sem light sleep e sem
; nenhum Serial.print() em andamento. Como a placa nao tem chip
; USB-serial separado (so o periferico nativo), a unica saida e nao
; inicializar o CDC. Gravar ESTE ambiente antes de usar o aparelho na
; bateria; volte pro [env:esp32-s3-devkitc-1] (com Serial/monitor
; serial) so quando for depurar com o cabo conectado.
[env:battery]
extends = env:esp32-s3-devkitc-1
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM
    -D ARDUINO_LOOP_STACK_SIZE=16384

